<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<h2 id="text">Hello, Gays</h2>
    <button id="btn">Click</button>

<script>

   btn.addEventListener("click",function(){
    text.innerText = "Good By"
   })
</script>
