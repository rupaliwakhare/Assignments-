<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    let body = document.querySelector("body")
    let para = document.createElement("p")
    para.innerText = "A paragraph is a group of sentences that work together to express a single idea clearly and effectively. In web development, paragraphs are created using the HTML &lt;p&gt; tag, which helps organize content and improve readability for users. Proper use of paragraphs makes a webpage look clean, structured, and easy to understand. Developers often combine paragraphs with styling and JavaScript to create dynamic and interactive content on a website."
    body.append(para)
</script>
</html>
